<mat-card style="padding: 5px; width: fit-content;">
    <mat-card-title>
        @if(turn()){
        Your turn!
        }@else {
        {{gameState.players[gameState.nextPlayer].name }}'s turn!
        }
    </mat-card-title>
    <mat-card-content [style]="turn() ? 'background-color: green' : 'background-color: red'">
        <mat-grid-list [cols]="gameState.size" rowHeight="1:1"
            style="width: 500px; background-color: black; padding: 5px;" gutterSize="5px">
            @for (tile of gameState.tiles; track $index) {
            <mat-grid-tile (click)="selectTile($index)" [colspan]="1" [rowspan]="1"
                [style.background]="'white'">{{gameState.tiles[$index] == null?
                '' : gameState.tiles[$index] == 1 ? 'X' :
                'O'}}</mat-grid-tile>
            }
        </mat-grid-list>
    </mat-card-content>
</mat-card>
